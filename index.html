    <section id="apresentacao" aria-label="Assessoria em Portugal">
      <img src="/apresentacao/pagina-2.webp" width="2880" height="1620" alt="" loading="lazy">
      <svg class="texto" viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Texto da página">
        <text x="437.72" y="305.68" font-size="30.00" textLength="557.52" lengthAdjust="spacingAndGlyphs">Sabemos que o processo de regularização em</text>
        <text x="397.93" y="335.68" font-size="30.00" textLength="637.11" lengthAdjust="spacingAndGlyphs">Portugal pode gerar muitas dúvidas, principalmente</text>
        <text x="469.95" y="365.68" font-size="30.00" textLength="493.06" lengthAdjust="spacingAndGlyphs">pela complexidade dos procedimentos e</text>
        <text x="571.40" y="395.68" font-size="30.00" textLength="297.18" lengthAdjust="spacingAndGlyphs">pelos prazos envolvidos.</text>
        <text x="391.22" y="455.68" font-size="30.00" textLength="650.52" lengthAdjust="spacingAndGlyphs">Nosso objetivo é te ajudar a entender, de forma mais</text>
        <text x="379.33" y="485.68" font-size="30.00" textLength="681.33" lengthAdjust="spacingAndGlyphs">clara e organizada, todos os seus direitos e quais são os</text>
        <text x="380.89" y="515.68" font-size="30.00" textLength="678.21" lengthAdjust="spacingAndGlyphs">próximos passos possíveis, sempre prensando de forma</text>
        <text x="401.72" y="545.68" font-size="30.00" textLength="636.54" lengthAdjust="spacingAndGlyphs">estratégica e segura, de acordo com a sua realidade</text>
      </svg>
    </section>
    <section id="sobre" aria-label="Bárbara Felipe">
      <img src="/apresentacao/pagina-3.webp" width="2880" height="1620" alt="" loading="lazy">
      <svg class="texto" viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Texto da página">
        <text x="956.34" y="86.84" font-size="23.17" textLength="369.30" lengthAdjust="spacingAndGlyphs">Desde então, já acompanhei mais de</text>
        <text x="119.93" y="99.84" font-size="25.68" textLength="291.67" lengthAdjust="spacingAndGlyphs">Há mais de 10 anos iniciei</text>
        <text x="967.81" y="109.34" font-size="23.17" textLength="346.36" lengthAdjust="spacingAndGlyphs">2000 processos e, empiricamente,</text>
        <text x="88.13" y="125.34" font-size="25.68" textLength="355.24" lengthAdjust="spacingAndGlyphs">minha carreira em advocacia no</text>
        <text x="962.58" y="131.84" font-size="23.17" textLength="356.83" lengthAdjust="spacingAndGlyphs">tomei conhecimento da burocracia,</text>
        <text x="94.65" y="150.84" font-size="25.68" textLength="342.22" lengthAdjust="spacingAndGlyphs">Brasil. Comecei num escritório</text>
        <text x="969.68" y="154.34" font-size="23.17" textLength="342.62" lengthAdjust="spacingAndGlyphs">das dificuldades e da insegurança,</text>
        <text x="103.19" y="176.34" font-size="25.68" textLength="325.13" lengthAdjust="spacingAndGlyphs">de grande relevância no país,</text>
        <text x="972.54" y="176.84" font-size="23.17" textLength="336.93" lengthAdjust="spacingAndGlyphs">que englobam a jornada de quem</text>
        <text x="89.80" y="201.84" font-size="25.68" textLength="351.92" lengthAdjust="spacingAndGlyphs">prestando assessoria e serviços</text>
        <text x="975.73" y="199.34" font-size="23.17" textLength="330.55" lengthAdjust="spacingAndGlyphs">decide recomeçar em outro país.</text>
        <text x="97.43" y="227.34" font-size="25.68" textLength="336.66" lengthAdjust="spacingAndGlyphs">a grandes empresas, incluindo</text>
        <text x="1000.29" y="244.34" font-size="23.17" textLength="281.41" lengthAdjust="spacingAndGlyphs">Além disso, por também ser</text>
        <text x="86.15" y="252.84" font-size="25.68" textLength="359.20" lengthAdjust="spacingAndGlyphs">multinacionais. Essa experiência</text>
        <text x="992.67" y="266.84" font-size="23.17" textLength="296.66" lengthAdjust="spacingAndGlyphs">imigrante, sei o que é sentir a</text>
        <text x="94.54" y="278.34" font-size="25.68" textLength="342.43" lengthAdjust="spacingAndGlyphs">me forneceu uma base técnica</text>
        <text x="998.56" y="289.34" font-size="23.17" textLength="284.86" lengthAdjust="spacingAndGlyphs">incerteza, lidar com o atraso</text>
        <text x="121.74" y="303.84" font-size="25.68" textLength="288.02" lengthAdjust="spacingAndGlyphs">sólida; porém, foi a minha</text>
        <text x="965.05" y="311.84" font-size="23.17" textLength="351.89" lengthAdjust="spacingAndGlyphs">burocrático, e perceber como tudo</text>
        <text x="95.73" y="329.34" font-size="25.68" textLength="340.05" lengthAdjust="spacingAndGlyphs">própria história que realmente</text>
        <text x="966.88" y="334.34" font-size="23.17" textLength="348.23" lengthAdjust="spacingAndGlyphs">isso afeta nossa vida cotidiana nos</text>
        <text x="102.62" y="354.84" font-size="25.68" textLength="319.71" lengthAdjust="spacingAndGlyphs">elevou a forma como exerço</text>
        <text x="986.88" y="356.84" font-size="23.17" textLength="308.23" lengthAdjust="spacingAndGlyphs">âmbitos pessoal e profissional.</text>
        <text x="175.86" y="380.34" font-size="25.68" textLength="179.78" lengthAdjust="spacingAndGlyphs">o que faço hoje.</text>
        <text x="974.14" y="401.84" font-size="23.17" textLength="333.70" lengthAdjust="spacingAndGlyphs">Portanto, todos esses fatores me</text>
        <text x="959.82" y="424.34" font-size="23.17" textLength="362.36" lengthAdjust="spacingAndGlyphs">levam a acompanhar cada caso com</text>
        <text x="125.20" y="431.34" font-size="25.68" textLength="281.10" lengthAdjust="spacingAndGlyphs">Em 2021, me mudei para</text>
        <text x="958.59" y="446.84" font-size="23.17" textLength="364.81" lengthAdjust="spacingAndGlyphs">máxima atenção e responsabilidade.</text>
        <text x="86.80" y="456.84" font-size="25.68" textLength="357.91" lengthAdjust="spacingAndGlyphs">Portugal com um objetivo claro:</text>
        <text x="969.27" y="469.34" font-size="23.17" textLength="343.45" lengthAdjust="spacingAndGlyphs">A meu ver, não se trata apenas de</text>
        <text x="104.87" y="482.34" font-size="25.68" textLength="321.78" lengthAdjust="spacingAndGlyphs">atuar na área da imigração e,</text>
        <text x="959.89" y="491.84" font-size="23.17" textLength="362.22" lengthAdjust="spacingAndGlyphs">um processo jurídico, mas, sim, uma</text>
        <text x="97.36" y="507.84" font-size="25.68" textLength="336.81" lengthAdjust="spacingAndGlyphs">assim, ajudar outras pessoas a</text>
        <text x="964.87" y="514.34" font-size="23.17" textLength="352.25" lengthAdjust="spacingAndGlyphs">garantia dos direitos de cada um, o</text>
        <text x="91.29" y="533.34" font-size="25.68" textLength="348.95" lengthAdjust="spacingAndGlyphs">passarem por esse processo de</text>
        <text x="964.64" y="536.84" font-size="23.17" textLength="346.78" lengthAdjust="spacingAndGlyphs">que afeta diretamente a qualidade</text>
        <text x="103.52" y="558.84" font-size="25.68" textLength="324.47" lengthAdjust="spacingAndGlyphs">forma segura e transparente.</text>
        <text x="1034.94" y="559.34" font-size="23.17" textLength="212.12" lengthAdjust="spacingAndGlyphs">de vida do imigrante.</text>
        <text x="436.35" y="647.54" font-size="22.87" textLength="558.41" lengthAdjust="spacingAndGlyphs">Estou devidamente inscrita na Ordem dos Advogados em</text>
        <text x="455.11" y="670.04" font-size="22.87" textLength="520.87" lengthAdjust="spacingAndGlyphs">Portugal, garantindo uma atuação ética, legal e segura.</text>
        <text x="468.45" y="692.54" font-size="22.87" textLength="499.56" lengthAdjust="spacingAndGlyphs">O meu compromisso é estar ao seu lado com clareza,</text>
        <text x="481.08" y="715.04" font-size="22.87" textLength="463.59" lengthAdjust="spacingAndGlyphs">seriedade e estratégia, para que você não precise</text>
        <text x="563.59" y="737.54" font-size="22.87" textLength="303.91" lengthAdjust="spacingAndGlyphs">enfrentar esse caminho sozinho.</text>
      </svg>
      <a class="area" aria-label="Consultar inscrição na Ordem dos Advogados" href="https://advogado.oa.pt/67769L/" style="left:45.1544%;top:93.2957%;width:9.0625%;height:3.3333%"></a>
    </section>

      <img src="/apresentacao/pagina-4.webp" width="2880" height="1620" alt="" loading="lazy">

        <text x="185.75" y="637.67" font-size="25.00" textLength="521.97" lengthAdjust="spacingAndGlyphs">Emissão de certidões de nascimento, inclusive no Brasil</text>
        <text x="185.75" y="686.87" font-size="25.00" textLength="346.38" lengthAdjust="spacingAndGlyphs">Registos de nascimento em Portugal</text>

    <section id="atendimento" aria-label="Sobre o processo">
      <img src="/apresentacao/pagina-5.webp" width="2880" height="1620" alt="" loading="lazy">
      <svg class="texto" viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Texto da página">
        <text x="622.82" y="309.88" font-size="38.00" textLength="663.92" lengthAdjust="spacingAndGlyphs">É importante considerar que os processos podem</text>
        <text x="621.80" y="349.63" font-size="38.00" textLength="665.95" lengthAdjust="spacingAndGlyphs">envolver prazos variáveis e etapas que dependem</text>
        <text x="645.81" y="389.38" font-size="38.00" textLength="625.43" lengthAdjust="spacingAndGlyphs">de órgãos públicos, o que nem sempre permite</text>
        <text x="860.81" y="429.13" font-size="38.00" textLength="195.41" lengthAdjust="spacingAndGlyphs">previsibilidade.</text>
        <text x="648.52" y="508.63" font-size="38.00" textLength="612.53" lengthAdjust="spacingAndGlyphs">A atuação jurídica, nesse contexto, tem como</text>
        <text x="666.41" y="548.38" font-size="38.00" textLength="576.72" lengthAdjust="spacingAndGlyphs">objetivo organizar o caminho, evitar erros e</text>
        <text x="219.41" y="602.77" font-size="57.01" textLength="150.31" lengthAdjust="spacingAndGlyphs">Sobre</text>
        <text x="682.57" y="588.13" font-size="38.00" textLength="544.41" lengthAdjust="spacingAndGlyphs">trazer mais clareza e segurança ao longo</text>
        <text x="873.31" y="627.88" font-size="38.00" textLength="170.43" lengthAdjust="spacingAndGlyphs">do processo.</text>
        <text x="167.09" y="644.77" font-size="57.01" textLength="268.07" lengthAdjust="spacingAndGlyphs">o processo</text>
      </svg>
    </section>
    <section id="depoimentos" aria-label="Depoimentos">
      <img src="/apresentacao/pagina-6.webp" width="2880" height="1620" alt="" loading="lazy">
      <svg class="texto" viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Texto da página">
        <text x="445.61" y="167.28" font-size="90.00" textLength="518.31" lengthAdjust="spacingAndGlyphs">Depoimentos</text>
        <text x="452.05" y="229.84" font-size="25.40" textLength="510.86" lengthAdjust="spacingAndGlyphs">Ao longo da minha atuação, já acompanhei diferentes casos</text>
        <text x="459.97" y="256.09" font-size="25.40" textLength="495.02" lengthAdjust="spacingAndGlyphs">de pessoas passando pelas mesmas dificuldades que você.</text>
        <text x="144.74" y="357.93" font-size="26.68" textLength="174.80" lengthAdjust="spacingAndGlyphs">Gabriel Oliveira</text>
        <text x="582.65" y="357.60" font-size="25.00" textLength="161.85" lengthAdjust="spacingAndGlyphs">Gurpreet Singh</text>
        <text x="1000.41" y="359.76" font-size="25.00" textLength="140.07" lengthAdjust="spacingAndGlyphs">Anali Alencar</text>
        <text x="1002.08" y="413.95" font-size="14.82" textLength="297.48" lengthAdjust="spacingAndGlyphs">A Bárbara abriu o meu processo em</text>
        <text x="1002.08" y="431.20" font-size="14.82" textLength="297.48" lengthAdjust="spacingAndGlyphs">dezembro de 2025 e, já em fevereiro, eu</text>
        <text x="142.49" y="432.77" font-size="15.00" textLength="294.68" lengthAdjust="spacingAndGlyphs">O meu processo de nacionalidade não foI</text>
        <text x="573.49" y="435.36" font-size="18.00" textLength="293.01" lengthAdjust="spacingAndGlyphs">Yes, I had a very positive experience</text>
        <text x="1002.08" y="448.45" font-size="14.82" textLength="297.48" lengthAdjust="spacingAndGlyphs">consegui a residência, foi tudo muito rápido e</text>
        <text x="142.49" y="450.77" font-size="15.00" textLength="294.67" lengthAdjust="spacingAndGlyphs">complicado em termos de documentação,</text>
        <text x="573.49" y="453.36" font-size="18.00" textLength="293.00" lengthAdjust="spacingAndGlyphs">with Dr. Barbara Felipe while she</text>
        <text x="1002.08" y="465.70" font-size="14.82" textLength="242.43" lengthAdjust="spacingAndGlyphs">ágil, muito além do que eu imaginava.</text>
        <text x="142.49" y="468.77" font-size="15.00" textLength="294.67" lengthAdjust="spacingAndGlyphs">principalmente porque tive acesso ao</text>
        <text x="573.49" y="471.36" font-size="18.00" textLength="293.01" lengthAdjust="spacingAndGlyphs">was handling my case. I had been</text>
        <text x="1002.08" y="482.95" font-size="14.82" textLength="297.48" lengthAdjust="spacingAndGlyphs">Fui atendida da melhor forma possível, com</text>
        <text x="142.49" y="486.77" font-size="15.00" textLength="294.67" lengthAdjust="spacingAndGlyphs">serviços prestado do escritório de advocacia</text>
        <text x="573.49" y="489.36" font-size="18.00" textLength="293.01" lengthAdjust="spacingAndGlyphs">waiting for almost a year, but with</text>
        <text x="1002.08" y="500.20" font-size="14.82" textLength="297.48" lengthAdjust="spacingAndGlyphs">tudo sempre muito claro, o que me deixou</text>
        <text x="142.49" y="504.77" font-size="15.00" textLength="294.67" lengthAdjust="spacingAndGlyphs">da Dra. Bárbara Felipe. O serviço é</text>
        <text x="573.49" y="507.36" font-size="18.00" textLength="293.01" lengthAdjust="spacingAndGlyphs">her guidance and support, I was able</text>
        <text x="1002.08" y="517.45" font-size="14.82" textLength="297.48" lengthAdjust="spacingAndGlyphs">super tranquila durante cada etapa. Um</text>
        <text x="142.49" y="522.77" font-size="15.00" textLength="294.67" lengthAdjust="spacingAndGlyphs">excelente. A Dra. Bárbara foi sempre muito</text>
        <text x="573.49" y="525.36" font-size="18.00" textLength="293.01" lengthAdjust="spacingAndGlyphs">to obtain my TRC in just 2 months.</text>
        <text x="1002.08" y="534.70" font-size="14.82" textLength="297.48" lengthAdjust="spacingAndGlyphs">ponto que fez muita diferença pra mim foi</text>
        <text x="142.49" y="540.77" font-size="15.00" textLength="294.68" lengthAdjust="spacingAndGlyphs">atenta aos prazos e soube aconselhar-me a</text>
        <text x="573.49" y="543.36" font-size="18.00" textLength="293.01" lengthAdjust="spacingAndGlyphs">Throughout the entire process, she</text>
        <text x="1002.08" y="551.95" font-size="14.82" textLength="297.48" lengthAdjust="spacingAndGlyphs">que ela me acompanhou na primeira</text>
        <text x="142.49" y="558.77" font-size="15.00" textLength="294.67" lengthAdjust="spacingAndGlyphs">dar entrada no processo antes da alteração</text>
        <text x="573.49" y="561.36" font-size="18.00" textLength="293.01" lengthAdjust="spacingAndGlyphs">provided regular updates, clear</text>
        <text x="1002.08" y="569.20" font-size="14.82" textLength="297.48" lengthAdjust="spacingAndGlyphs">entrevista, me ajudando com a comunicação</text>
        <text x="142.49" y="576.77" font-size="15.00" textLength="294.67" lengthAdjust="spacingAndGlyphs">da lei da nacionalidade, que poderá dificultar</text>
        <text x="573.49" y="579.36" font-size="18.00" textLength="293.01" lengthAdjust="spacingAndGlyphs">explanations, and consistent support</text>
        <text x="1002.08" y="586.45" font-size="14.82" textLength="297.47" lengthAdjust="spacingAndGlyphs">e deixando tudo mais fácil. Como não foi</text>
        <text x="142.49" y="594.77" font-size="15.00" textLength="294.68" lengthAdjust="spacingAndGlyphs">bastante a vida de muitos imigrantes. Esse</text>
        <text x="573.49" y="597.36" font-size="18.00" textLength="44.13" lengthAdjust="spacingAndGlyphs">every</text>
        <text x="639.60" y="597.36" font-size="18.00" textLength="33.84" lengthAdjust="spacingAndGlyphs">step</text>
        <text x="695.42" y="597.36" font-size="18.00" textLength="16.52" lengthAdjust="spacingAndGlyphs">of</text>
        <text x="733.92" y="597.36" font-size="18.00" textLength="26.00" lengthAdjust="spacingAndGlyphs">the</text>
        <text x="781.91" y="597.36" font-size="18.00" textLength="36.61" lengthAdjust="spacingAndGlyphs">way.</text>
        <text x="840.51" y="597.36" font-size="18.00" textLength="25.99" lengthAdjust="spacingAndGlyphs">My</text>
        <text x="1002.08" y="603.70" font-size="14.82" textLength="297.48" lengthAdjust="spacingAndGlyphs">possível prosseguir nessa primeira tentativa,</text>
        <text x="142.49" y="612.77" font-size="15.00" textLength="294.68" lengthAdjust="spacingAndGlyphs">cuidado fez muita diferença para mim. O</text>
        <text x="573.49" y="615.36" font-size="18.00" textLength="293.01" lengthAdjust="spacingAndGlyphs">experience with her was excellent,</text>
        <text x="1002.08" y="620.95" font-size="14.82" textLength="297.48" lengthAdjust="spacingAndGlyphs">ela também facilitou rapidamente um novo</text>
        <text x="142.49" y="630.77" font-size="15.00" textLength="294.68" lengthAdjust="spacingAndGlyphs">sistema burocrático em Portugal ainda é</text>
        <text x="573.49" y="633.36" font-size="18.00" textLength="293.01" lengthAdjust="spacingAndGlyphs">and I’m truly grateful for all the help</text>
